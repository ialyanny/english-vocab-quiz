<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>單字勇者</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg1: #1e1b4b; --bg2: #312e81; --card: #ffffff; --ink: #1e293b; --muted: #64748b;
    --gold: #f59e0b; --good: #16a34a; --bad: #dc2626; --accent: #6366f1;
    --c-common: #94a3b8; --c-rare: #3b82f6; --c-epic: #a855f7; --c-legend: #f59e0b;
  }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(circle at 30% 0%, var(--bg2), var(--bg1) 70%);
    color: var(--ink); min-height: 100vh; min-height: 100dvh;
    padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 680px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadein .25s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 16px 40px rgba(0,0,0,.3); margin-bottom: 14px; }
  h1 { color: #fff; text-align: center; font-size: 2rem; margin: 12px 0 4px; text-shadow: 0 3px 0 #0006; }
  h2 { font-size: 1.2rem; margin-bottom: 10px; }
  .sub { color: #c7d2fe; text-align: center; margin-bottom: 16px; }
  button { font-family: inherit; cursor: pointer; border: none; }
  button:active { transform: scale(.96); }
  .btn { padding: 14px 18px; border-radius: 16px; font-size: 1.05rem; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 5px 0 #4338ca; }
  .btn.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 5px 0 #b45309; color: #451a03; }
  .btn.ghost { background: #eef2ff; color: #4338ca; box-shadow: 0 4px 0 #c7d2fe; }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; }
  input[type=text] { width: 100%; padding: 14px 16px; font-size: 1.3rem; border: 3px solid #c7d2fe; border-radius: 14px; outline: none; text-align: center; }
  input[type=text]:focus { border-color: var(--accent); }

  /* 頂部狀態列 */
  .hud { display: flex; align-items: center; gap: 10px; color: #fff; margin-bottom: 12px; }
  .hud .hero-mini { font-size: 2rem; background: #fff2; border-radius: 14px; width: 52px; height: 52px; display: grid; place-items: center; }
  .hud .who { flex: 1; }
  .hud .who b { font-size: 1.1rem; }
  .xpbar { height: 8px; background: #fff3; border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: #34d399; }
  .pill { background: #0004; color: #fde68a; padding: 6px 10px; border-radius: 999px; font-weight: 800; white-space: nowrap; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }

  /* 地圖 */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; }
  .tab { flex: 1; white-space: nowrap; padding: 12px 14px; border-radius: 14px; font-weight: 800; font-size: 1rem; background: #fff2; color: #e0e7ff; }
  .tab.on { background: #fff; color: #312e81; box-shadow: 0 4px 0 #a5b4fc; }
  .island.extra { margin-left: 22px; padding: 10px 14px; opacity: .92; }
  .island.extra .iemoji { font-size: 1.6rem; }
  .island.extra .iname { font-size: 1rem; }
  .island { border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; color: #fff; position: relative; overflow: hidden; }
  .island .ihead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .island .iemoji { font-size: 2.2rem; }
  .island .iname { font-weight: 900; font-size: 1.15rem; text-shadow: 0 2px 0 #0004; }
  .island .imeta { font-size: .85rem; opacity: .9; }
  .stages { display: flex; flex-wrap: wrap; gap: 8px; }
  .stage { width: 58px; height: 64px; border-radius: 14px; background: #fff; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 0 #0003; }
  .stage .st { font-size: .7rem; letter-spacing: -1px; color: var(--gold); min-height: 12px; }
  .stage.locked { background: #fff5; color: #fff9; box-shadow: none; }
  .stage.boss { width: 74px; background: linear-gradient(135deg, #fecaca, #fca5a5); }
  .stage.boss.locked { background: #0003; }
  .stage.next { outline: 3px solid #fde047; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }

  /* 戰鬥 */
  .arena { background: linear-gradient(#7dd3fc, #bbf7d0); border-radius: 24px; padding: 14px 16px 10px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .arena-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
  .hearts { font-size: 1.3rem; letter-spacing: 1px; }
  .fighters { display: flex; justify-content: space-between; align-items: flex-end; height: 175px; margin-top: 12px; padding-left: 40px; }
  .hero { font-size: 4rem; position: relative; transition: transform .15s; }
  .hero .gear { position: absolute; font-size: 1.6rem; }
  .hero .g-weapon { right: -18px; top: 18px; }
  .hero .g-helmet { left: 14px; top: -22px; }
  .hero .g-pet { left: -30px; bottom: 0; font-size: 1.8rem; }
  .hero .g-armor { right: -14px; bottom: -2px; font-size: 1.3rem; }
  .monster-wrap { text-align: center; position: relative; }
  .monster { font-size: 5rem; display: inline-block; transition: transform .1s; }
  .monster.boss { font-size: 6.5rem; }
  .mhp { width: 160px; height: 14px; background: #0003; border-radius: 7px; overflow: hidden; margin: 0 auto 4px; border: 2px solid #fff; }
  .mhp i { display: block; height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); transition: width .4s; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-10px) rotate(-6deg); } 40% { transform: translateX(10px) rotate(6deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  .lunge { transform: translateX(40px) scale(1.1); }
  .hurt { animation: hurt .4s; }
  @keyframes hurt { 30% { transform: translateX(-12px); filter: drop-shadow(0 0 10px red); } }
  .float { position: absolute; font-weight: 900; font-size: 1.8rem; color: #fff; -webkit-text-stroke: 1.5px #b91c1c; pointer-events: none; animation: floatup .9s forwards; }
  .float.crit { font-size: 2.4rem; color: #fde047; -webkit-text-stroke: 2px #b45309; }
  .float.miss { color: #fff; -webkit-text-stroke: 1.5px #1e3a8a; }
  @keyframes floatup { to { transform: translateY(-60px); opacity: 0; } }
  .combo { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); color: #fff; font-weight: 900; -webkit-text-stroke: 1px #9a3412; font-size: 1.2rem; }

  .qcard { text-align: center; }
  .qtype { color: var(--muted); font-size: .9rem; font-weight: 700; margin-bottom: 6px; }
  .qmain { font-size: 1.9rem; font-weight: 900; margin-bottom: 4px; word-break: break-word; }
  .qmain.zh { font-size: 1.4rem; }
  .qsent { font-size: 1.15rem; line-height: 1.6; margin-bottom: 6px; }
  .qsub { color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }
  .speaker { font-size: 2.6rem; background: #eef2ff; width: 84px; height: 84px; border-radius: 50%; margin: 4px auto 12px; display: grid; place-items: center; }
  .choices { display: grid; gap: 10px; }
  .choice { padding: 14px; border-radius: 14px; background: #f1f5f9; border: 3px solid #e2e8f0; font-size: 1.1rem; font-weight: 700; color: var(--ink); text-align: center; }
  .choice.right { background: #dcfce7; border-color: var(--good); }
  .choice.wrong { background: #fee2e2; border-color: var(--bad); }
  .choice.gone { visibility: hidden; }
  .tools { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 10px; }
  .feedback { margin-top: 12px; padding: 12px; border-radius: 14px; font-weight: 800; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: #dcfce7; color: #166534; }
  .feedback.no { background: #fee2e2; color: #991b1b; }

  /* 結算 */
  .result { text-align: center; }
  .result .big { font-size: 4rem; }
  .stars { font-size: 2.6rem; letter-spacing: 6px; margin: 6px 0; }
  .stars .off { filter: grayscale(1) opacity(.3); }
  .rewards { display: flex; justify-content: center; gap: 14px; margin: 10px 0 14px; font-weight: 800; flex-wrap: wrap; }
  .chest { font-size: 4.5rem; display: inline-block; margin: 6px 0; }
  .chest.wiggle { animation: wiggle .5s infinite; }
  @keyframes wiggle { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  .loot { display: inline-block; padding: 14px 20px; border-radius: 18px; border: 4px solid; margin: 8px 0; animation: pop .4s; }
  @keyframes pop { from { transform: scale(.3); } 70% { transform: scale(1.15); } }
  .loot .le { font-size: 3.4rem; }
  .missed { text-align: left; background: #fef2f2; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-size: .95rem; }
  .missed div { padding: 3px 0; }

  /* 背包 */
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .slot { background: #f1f5f9; border-radius: 14px; padding: 8px 4px; text-align: center; font-size: .75rem; color: var(--muted); border: 3px solid #e2e8f0; }
  .slot .se { font-size: 2rem; display: block; min-height: 2.4rem; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-weight: 700; margin-bottom: 4px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .item { border: 3px solid; border-radius: 14px; padding: 8px; text-align: left; background: #fff; display: flex; gap: 8px; align-items: center; }
  .item .ie { font-size: 2rem; }
  .item .in { font-weight: 800; font-size: .95rem; }
  .item .is { font-size: .78rem; color: var(--muted); }
  .item.eq { background: #fef9c3; }
  .r-common { border-color: var(--c-common); } .r-rare { border-color: var(--c-rare); }
  .r-epic { border-color: var(--c-epic); } .r-legend { border-color: var(--c-legend); }
  .t-common { color: var(--c-common); } .t-rare { color: var(--c-rare); } .t-epic { color: var(--c-epic); } .t-legend { color: var(--c-legend); }
  .muted { color: var(--muted); font-size: .9rem; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  /* 關卡種類圖示 */
  .stage { height: 72px; }
  .stage .sk { font-size: .95rem; line-height: 1; }
  .stage.locked .sk { filter: grayscale(1) opacity(.6); }

  /* 技能 */
  .b-skills { position: absolute; left: 12px; bottom: 6px; font-size: 1.2rem; letter-spacing: 2px; }
  .modal { position: fixed; inset: 0; background: #0009; display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal.show { display: flex; animation: fadein .2s; }
  .modal-box { background: #fff; border-radius: 24px; padding: 20px; width: 100%; max-width: 560px; text-align: center; }
  .skill-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .skill-card { background: linear-gradient(160deg, #eef2ff, #fdf4ff); border: 3px solid #a5b4fc; border-radius: 18px; padding: 14px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); font-size: 1rem; animation: pop .35s backwards; }
  .skill-card:nth-child(2) { animation-delay: .08s; } .skill-card:nth-child(3) { animation-delay: .16s; }
  .skill-card .sk-e { font-size: 2.6rem; }
  .skill-card .sk-d { font-size: .82rem; color: var(--muted); }
  @media (max-width: 480px) { .skill-cards { grid-template-columns: 1fr; } .skill-card { flex-direction: row; text-align: left; } .skill-card .sk-e { font-size: 2rem; } }

  /* 字母拼圖 */
  .speaker.small { width: 56px; height: 56px; font-size: 1.6rem; margin: 2px auto 10px; }
  .sc-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .sc-slot { width: 40px; height: 48px; border-radius: 10px; border: 3px dashed #a5b4fc; background: #f8fafc; font-size: 1.4rem; font-weight: 900; color: var(--ink); }
  .sc-slot.filled { border-style: solid; background: #eef2ff; }
  .sc-slot.locked { border-style: solid; border-color: #f59e0b; background: #fef3c7; }
  .sc-slot.fixed { display: grid; place-items: center; border: none; background: none; width: 16px; }
  .sc-slot.right { border-color: var(--good); background: #dcfce7; }
  .sc-slot.wrong { border-color: var(--bad); background: #fee2e2; }
  .sc-gap { width: 18px; }
  .sc-tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .sc-tile { width: 48px; height: 52px; border-radius: 12px; background: linear-gradient(#fde68a, #fbbf24); box-shadow: 0 4px 0 #b45309;
    font-size: 1.5rem; font-weight: 900; color: #451a03; }
  .sc-tile.used { visibility: hidden; }

  /* 小遊戲共用 */
  .mini-head { display: flex; justify-content: space-between; align-items: center; color: #fff; font-weight: 800; margin-bottom: 10px; gap: 8px; }
  .mini-info { text-align: center; color: var(--muted); margin-bottom: 12px; }

  /* 翻牌 */
  .match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mcard { height: 92px; border-radius: 14px; position: relative; background: linear-gradient(135deg, #818cf8, #c084fc); box-shadow: 0 4px 0 #6d28d9;
    color: var(--ink); padding: 4px; transition: transform .2s; }
  .mcard .back { font-size: 2.2rem; }
  .mcard .face { display: none; font-weight: 800; font-size: .95rem; line-height: 1.25; word-break: break-word; }
  .mcard .face.en { font-size: 1.05rem; color: #1e3a8a; }
  .mcard.open, .mcard.done { background: #fff; border: 3px solid #c7d2fe; box-shadow: none; transform: rotateY(180deg) scaleX(-1); }
  .mcard.open .back, .mcard.done .back { display: none; }
  .mcard.open .face, .mcard.done .face { display: block; }
  .mcard.done { background: #dcfce7; border-color: var(--good); opacity: .75; }
  .mcard.bad { background: #fee2e2; border-color: var(--bad); animation: shake .35s; }

  /* 打地鼠 / 泡泡 */
  .tap-prompt { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; margin-bottom: 10px; font-weight: 800; color: var(--muted); }
  .tap-prompt .speaker.small { margin: 0; }
  .tp-zh { font-size: 1.5rem; color: var(--ink); background: #eef2ff; padding: 10px 18px; border-radius: 14px; }
  .mole-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: linear-gradient(#86efac, #4ade80); padding: 14px; border-radius: 20px; }
  .hole { height: 110px; border-radius: 50% / 40%; background: radial-gradient(ellipse at 50% 80%, #713f12 55%, #a16207 56%, transparent 70%); position: relative; overflow: hidden; }
  .mole { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); background: none; display: flex; flex-direction: column; align-items: center; animation: moleup .25s ease-out; }
  .mole .me { font-size: 2.6rem; line-height: 1; }
  .mole .mw { background: #fff; border-radius: 10px; padding: 3px 8px; font-weight: 900; font-size: .95rem; color: var(--ink); box-shadow: 0 2px 0 #0003; white-space: nowrap; }
  @keyframes moleup { from { transform: translate(-50%, 90px); } }
  .mole.hit .me { animation: bonk .3s forwards; }
  .mole.hit .mw { background: #dcfce7; }
  @keyframes bonk { 40% { transform: scaleY(.5); } 100% { transform: translateY(80px); } }
  .mole.miss { opacity: .35; }
  .mole.reveal .mw, .bubble.reveal { background: #fde68a; outline: 3px solid #f59e0b; }
  .bubble-field { position: relative; height: 440px; border-radius: 20px; overflow: hidden; background: linear-gradient(#0ea5e9, #1e3a8a); }
  .bubble { position: absolute; bottom: -130px; width: 23%; min-width: 74px; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #bae6fd 30%, #38bdf8cc 70%); border: 2px solid #e0f2fe;
    font-weight: 900; font-size: .95rem; color: #0c4a6e; padding: 4px; word-break: break-word; animation: rise linear forwards; }
  @keyframes rise { to { transform: translateY(-600px); } }
  .bubble.hit { animation: popb .3s forwards !important; }
  @keyframes popb { to { transform: scale(1.6); opacity: 0; } }
  .bubble.miss { opacity: .3; }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: #111827; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 800; z-index: 10; display: none; }
  .toast.show { display: block; animation: fadein .2s; }
</style>
</head>
<body>
<div class="app">

  <!-- 登入 -->
  <div class="screen" id="s-login">
    <h1>⚔️ 單字勇者</h1>
    <p class="sub">打倒單字怪物，收集裝備，成為最強勇者！</p>
    <div class="card">
      <h2>勇者，你叫什麼名字？</h2>
      <input type="text" id="login-name" placeholder="輸入名字" maxlength="12" autocomplete="off">
      <div style="height:12px"></div>
      <button class="btn full" onclick="login()">出發冒險 ▶</button>
      <p class="muted" style="margin-top:10px">同一台裝置用同樣的名字，就會接續之前的進度。</p>
    </div>
  </div>

  <!-- 地圖 -->
  <div class="screen" id="s-map">
    <div class="hud" id="hud"></div>
    <div class="nav">
      <button class="btn gold" onclick="openBag()">🎒 背包裝備</button>
      <button class="btn ghost" onclick="openShop()">🏪 寶箱商店</button>
    </div>
    <div id="islands"></div>
    <p class="muted" style="color:#c7d2fe;text-align:center;margin:10px 0">
      <a href="index.html" style="color:#c7d2fe">← 回到一般考試模式</a> · <a href="#" style="color:#c7d2fe" onclick="logout();return false">換人玩</a>
    </p>
  </div>

  <!-- 戰鬥 -->
  <div class="screen" id="s-battle">
    <div class="arena" id="arena">
      <div class="arena-top">
        <span class="hearts" id="b-hearts"></span>
        <span id="b-title"></span>
        <button class="btn ghost" style="padding:6px 10px;font-size:.85rem" onclick="quitBattle()">撤退</button>
      </div>
      <div class="combo" id="b-combo"></div>
      <div class="b-skills" id="b-skills"></div>
      <div class="fighters">
        <div class="hero" id="b-hero"></div>
        <div class="monster-wrap">
          <div class="mhp"><i id="b-mhp"></i></div>
          <div class="muted" id="b-mleft" style="color:#334155;font-weight:700"></div>
          <div class="monster" id="b-monster"></div>
        </div>
      </div>
    </div>
    <div class="card qcard" id="b-q"></div>
  </div>

  <!-- 小遊戲（翻牌 / 打地鼠 / 泡泡） -->
  <div class="screen" id="s-mini">
    <div class="mini-head">
      <span class="hearts" id="m-hearts"></span>
      <span id="m-title"></span>
      <button class="btn ghost" style="padding:6px 10px;font-size:.85rem" onclick="quitBattle()">撤退</button>
    </div>
    <div class="card">
      <p class="mini-info" id="m-info"></p>
      <div id="m-area"></div>
    </div>
  </div>

  <!-- 結算 -->
  <div class="screen" id="s-result">
    <div class="card result" id="result-body"></div>
  </div>

  <!-- 背包 -->
  <div class="screen" id="s-bag">
    <div class="card">
      <h2>🧒 我的勇者</h2>
      <div class="slots" id="bag-slots"></div>
      <div class="stats" id="bag-stats"></div>
    </div>
    <div class="card">
      <h2>🎒 裝備收藏 <span class="muted" id="bag-count"></span></h2>
      <p class="muted" style="margin-bottom:10px">點一下就能穿上，再點一次脫下。</p>
      <div class="items" id="bag-items"></div>
    </div>
    <button class="btn full" onclick="showMap()">← 回到地圖</button>
  </div>

  <!-- 商店 -->
  <div class="screen" id="s-shop">
    <div class="card" style="text-align:center">
      <h2>🏪 寶箱商店</h2>
      <div class="chest">🎁</div>
      <p style="font-weight:800;margin-bottom:4px">神秘寶箱 💰 <span id="shop-price"></span></p>
      <p class="muted" style="margin-bottom:14px">隨機獲得一件裝備！重複的裝備會變成金幣。</p>
      <button class="btn gold full" id="shop-buy" onclick="buyChest()">購買並打開</button>
      <div id="shop-loot"></div>
    </div>
    <div class="card">
      <h2>📊 掉寶機率</h2>
